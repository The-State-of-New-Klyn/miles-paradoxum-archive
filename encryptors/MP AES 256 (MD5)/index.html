<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP | AES 256</title>
    <script src="code.js"></script> <!-- Укажите путь к вашей библиотеке -->
</head>
<body>
    <h1>Advanced Encryption System 256</h1>
    
    <label for="inputText">Введите текст для шифрования или дешифрования:</label><br>
    <textarea id="inputText" rows="4" cols="50"></textarea><br><br>
    
    <label for="key">Введите ключ:</label><br>
    <input type="text" id="key"><br><br>
    
    <button onclick="encryptText()">Зашифровать</button>
    <button onclick="decryptText()">Дешифровать</button>

    <h2>Результат:</h2>
    <p id="result"></p>

    <script>
        function encryptText() {
            const inputText = document.getElementById('inputText').value;
            const key = document.getElementById('key').value;

            if (inputText && key) {
                const encrypted = CryptoJS.AES.encrypt(inputText, key).toString();
                document.getElementById('result').innerText = encrypted;
                document.getElementById('inputText').value = "";
            } else {
                alert("Пожалуйста, введите текст и ключ для шифрования.");
            }
        }

        function decryptText() {
            const inputText = document.getElementById('inputText').value;
            const key = document.getElementById('key').value;

            if (inputText && key) {
                const decrypted = CryptoJS.AES.decrypt(inputText, key);
                const originalText = decrypted.toString(CryptoJS.enc.Utf8);

                if (originalText) {
                    document.getElementById('result').innerText = originalText;
                } else {
                    alert("Неверный ключ для дешифрования или данные повреждены.");
                }
            } else {
                alert("Пожалуйста, введите текст и ключ для дешифрования.");
            }
        }
    </script>
</body>
</html>
